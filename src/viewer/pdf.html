<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PDF</title>
<!-- Jam Browser 공유 PDF 뷰어 (pdf.js, Apache-2.0). PDF 안의 스크립트는 실행하지 않아요 -->
<link rel="stylesheet" href="/_jam/pdfjs/web/pdf_viewer.css">
<style>
  html, body { margin: 0; background: #3b3d40; font: 13px/1.4 "Segoe UI", "Malgun Gothic", sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 38px; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: #26282b; color: #eee; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #bar .name { font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 45vw; }
  #bar .sp { flex: 1; }
  #bar button { height: 26px; min-width: 28px; border: 1px solid #4a4d52; border-radius: 6px; background: #33363a; color: #eee; cursor: pointer; font: inherit; }
  #bar button:hover { background: #3d4045; }
  #zoom, #pageinfo { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; color: #cfcfcf; }
  #pages { padding: 50px 0 30px; }
  .pg { position: relative; margin: 0 auto 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.45); overflow: hidden; }
  .pg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pg .num { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #999; z-index: 2; pointer-events: none; }
  #msg { color: #eee; text-align: center; padding: 80px 20px; }
</style>
</head>
<body>
<div id="bar">
  <span class="name" id="name">PDF</span>
  <span class="sp"></span>
  <span id="pageinfo"></span>
  <button id="zout" title="축소">−</button>
  <span id="zoom">100%</span>
  <button id="zin" title="확대">＋</button>
  <button id="fit" title="창 폭에 맞추기">폭 맞춤</button>
</div>
<div id="pages"><div id="msg">PDF 를 여는 중…</div></div>
<script type="module" src="/_jam/pdf-viewer.js"></script>
</body>
</html>
